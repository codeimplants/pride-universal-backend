spring:
  application:
    name: pride-universal-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pride_universal}
    username: ${DB_USER:pride}
    password: ${DB_PASSWORD:pride_dev_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      # Flyway owns the schema. Never let Hibernate touch it.
      ddl-auto: validate
    open-in-view: false          # avoids lazy-loading in the view layer (N+1 source)
    properties:
      hibernate:
        jdbc.time_zone: Asia/Kolkata
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    # Java camelCase <-> JSON snake_case, matching the existing frontend contract
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  threads:
    virtual:
      enabled: true              # Java 21 virtual threads for request handling

  cache:
    type: caffeine

  http:
    client:
      # Outbound calls (Code Implants Messaging). Never wait forever on a provider.
      connect-timeout: 5s
      read-timeout: 15s

app:
  jwt:
    # Override in prod. Must be >= 32 bytes for HS256.
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-32b+}
    access-token-ttl: PT12H
    refresh-token-ttl: P30D
    issuer: pride-universal

  otp:
    length: 6
    ttl: PT5M
    max-attempts: 5
    resend-cooldown: PT60S
    # When true, the OTP is returned in the send response (dev_otp) for local
    # development and tests. Off unless asked for: a forgotten variable must not
    # turn into a login bypass. Refused at startup with a live messaging key.
    dev-mode: ${OTP_DEV_MODE:false}

  sms:
    # console (local: the code is logged) | messaging (Code Implants Messaging: dev and prod)
    provider: ${SMS_PROVIDER:console}
    messaging:
      # Written into <env>.env by messaging-backend's connect-app.sh. dev: https://dev.msg.codeimplants.com
      base-url: ${MESSAGING_BASE_URL:https://msg.codeimplants.com}
      api-key: ${MESSAGING_API_KEY:}
      # dev only: 123456, the fixed code every Code Implants app uses outside prod.
      fixed-code: ${MESSAGING_FIXED_CODE:}

  storage:
    provider: ${STORAGE_PROVIDER:local}  # local | s3
    local:
      base-path: ${STORAGE_PATH:./uploads}
    max-file-size-mb: 10

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8081,exp://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-stacktrace: never

logging:
  level:
    com.prideuniversal: DEBUG
    org.springframework.security: INFO
