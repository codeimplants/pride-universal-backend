services:
  db:
    image: postgres:16-alpine
    container_name: pride-db
    environment:
      POSTGRES_DB: pride_universal
      POSTGRES_USER: pride
      POSTGRES_PASSWORD: pride_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pride -d pride_universal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
