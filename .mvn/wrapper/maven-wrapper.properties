# Pins the Maven version for this project so the ancient Maven 3.3.9 on PATH
# is never used. "only-script" needs no wrapper jar - mvnw downloads the
# distribution itself on first run.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
